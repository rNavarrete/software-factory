name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tool
        run: python -m pip install ruff==0.15.12
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  # One stable name for the branch rule to require, whatever the matrix holds.
  # The ruleset on main requires "checks": rename this job and the rule breaks.
  checks:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test.result }}" = success
